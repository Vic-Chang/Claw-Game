<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>飛絡力標準台 夾娃娃機</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="stage"></div>

    <header id="topbar">
      <div class="brand">飛絡力標準台 <span>三爪 · 真實物理</span></div>
      <div class="stats">
        <div class="stat"><label>投幣</label><b id="hud-credit">0</b></div>
        <div class="stat"><label>時間</label><b id="hud-time">--</b></div>
        <div class="stat" id="hud-acc-wrap"><label>累保</label><b id="hud-acc">0</b></div>
        <div class="stat"><label>剩餘獎品</label><b id="hud-left">0</b></div>
      </div>
      <div class="actions">
        <button id="btn-view" title="切換視角 (V)">視角：正面</button>
        <button id="btn-sound" title="音量">🔊</button>
        <button id="btn-operator" class="key" title="台主模式">🔑 台主模式</button>
      </div>
    </header>

    <div id="toast" hidden></div>
    <div id="loading">載入物理引擎中…</div>

    <footer id="controls">
      <div id="joystick" aria-label="搖桿">
        <div class="base"><div class="knob"></div></div>
      </div>
      <div class="center-info">
        <div id="hud-msg">投幣開始遊戲</div>
        <div class="keys">方向鍵 / WASD 移動 · 空白鍵 取物 · C 投幣 · V 視角</div>
      </div>
      <div class="buttons">
        <button id="btn-coin" class="coin">投幣<br /><small id="coin-label">10 元</small></button>
        <button id="btn-grab" class="grab">取物</button>
      </div>
    </footer>

    <aside id="operator" hidden>
      <div class="op-head">
        <h2>🔑 台主模式</h2>
        <button id="op-close" aria-label="關閉">✕</button>
      </div>
      <nav class="tabs">
        <button data-tab="board" class="active">中控面板</button>
        <button data-tab="table">參數表</button>
        <button data-tab="claw">爪子調整</button>
        <button data-tab="layout">機台佈置</button>
        <button data-tab="monitor">物理監看</button>
      </nav>
      <section data-panel="board" class="panel active"></section>
      <section data-panel="table" class="panel"></section>
      <section data-panel="claw" class="panel"></section>
      <section data-panel="layout" class="panel"></section>
      <section data-panel="monitor" class="panel"></section>
    </aside>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
